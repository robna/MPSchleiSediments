[project]
name = "gepardBlindCorr"
version = "0.1.0"
description = "Python scripts for microplastic data processing with GEPARD blind correction procedures"
authors = [
    {name = "Robin Lenz", email = "robin.lenz@io-warnemuende.de"},
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "mysql-connector-python>=8.0.0",
    "jupyter>=1.0.0",
]
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
keywords = ["microplastics", "gepard", "blind-correction", "database", "quality-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/robna/gepardBlindCorr"
Repository = "https://github.com/robna/gepardBlindCorr.git"
Documentation = "https://github.com/robna/gepardBlindCorr#readme"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
